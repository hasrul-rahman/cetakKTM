name = "cetakktm-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env.production]
vars = { ENVIRONMENT = "production" }

[build]
cwd = "."
command = "npm install && npm run build"

[build.upload]
format = "service-worker"

[[d1_databases]]
binding = "DB"
database_name = "cetakktm"
database_id = "your-db-id"
