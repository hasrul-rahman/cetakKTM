<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cetak KTM - Daftar Mahasiswa</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background-image: url('{{ bg_url if bg_url else "" }}');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
    }
    .card { background: rgba(255,255,255,0.9); padding: 12px; margin: 8px; border-radius: 6px; display:flex; align-items:center; gap:12px; }
    .photo { width:80px; height:100px; object-fit:cover; border:1px solid #ccc; }
  </style>
</head>
<body>
  <header>
    <h1>Daftar Mahasiswa</h1>
    <nav><a href="/settings">Pengaturan (upload background / csv / foto)</a></nav>
  </header>
  <main>
    {% if mhs %}
      <div>
        {% for m in mhs %}
          <div class="card">
            {% if m.photo_url() %}
              <img class="photo" src="{{ m.photo_url() }}" alt="foto {{ m.nim }}">
            {% else %}
              <div style="width:80px;height:100px;background:#eee;display:flex;align-items:center;justify-content:center;color:#666;">No Photo</div>
            {% endif %}
            <div>
              <div><strong>{{ m.nama }}</strong></div>
              <div>NIM: {{ m.nim }}</div>
              <div>Prodi: {{ m.prodi }}</div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p>Tidak ada data mahasiswa.</p>
    {% endif %}
  </main>
</body>
</html>
