<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cetak KTM - Kartu Tanda Mahasiswa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Aplikasi Cetak KTM</h1>
            <p class="subtitle">Kartu Tanda Mahasiswa</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" data-tab="print">Cetak KTM</button>
            <button class="tab-button" data-tab="manage">Kelola Data</button>
        </div>

        <!-- Tab 1: Cetak KTM -->
        <div id="print" class="tab-content active">
            <section class="section">
                <h2>Cetak KTM (Kartu Tanda Mahasiswa)</h2>
                
                <div class="form-group">
                    <label for="search-nim">Input NIM:</label>
                    <div class="input-group">
                        <input type="text" id="search-nim" placeholder="Masukkan NIM Mahasiswa..." class="input-field">
                        <button class="btn btn-primary" onclick="searchMahasiswa()">Cari</button>
                    </div>
                </div>

                <div id="student-data" class="student-data" style="display: none;">
                    <div class="data-field">
                        <label>NIM:</label>
                        <span id="display-nim">-</span>
                    </div>
                    <div class="data-field">
                        <label>Nama:</label>
                        <span id="display-nama">-</span>
                    </div>
                    <div class="data-field">
                        <label>Program Studi:</label>
                        <span id="display-prodi">-</span>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" id="btn-preview" onclick="previewKTM()" disabled>Preview KTM</button>
                    <button class="btn btn-success" id="btn-print" onclick="downloadPDF()" disabled>Cetak PDF</button>
                    <button class="btn btn-danger" onclick="clearForm()">Hapus</button>
                </div>
            </section>
        </div>

        <!-- Tab 2: Kelola Data -->
        <div id="manage" class="tab-content">
            <section class="section">
                <h2>Kelola Data Mahasiswa</h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="form-nim">NIM:</label>
                        <input type="text" id="form-nim" class="input-field" placeholder="Masukkan NIM">
                    </div>
                    <div class="form-group">
                        <label for="form-nama">Nama:</label>
                        <input type="text" id="form-nama" class="input-field" placeholder="Masukkan Nama">
                    </div>
                    <div class="form-group">
                        <label for="form-prodi">Program Studi:</label>
                        <input type="text" id="form-prodi" class="input-field" placeholder="Masukkan Program Studi">
                    </div>
                    <div class="form-group">
                        <label for="form-tanggal">Tanggal Lahir (opsional):</label>
                        <input type="date" id="form-tanggal" class="input-field">
                    </div>
                </div>
                
                <button class="btn btn-primary" onclick="addMahasiswa()">Tambah Data</button>
                <button class="btn btn-info" onclick="loadAllMahasiswa()">Refresh Data</button>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>
                            <th>Program Studi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data akan diisi oleh JavaScript -->
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Aplikasi Cetak KTM. Version 2.0 Web</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
